<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTO/Return Pattern — Seller Pro</title>
<style>
  :root{--accent:#7c3aed;--accent2:#4c1d95;--bad:#dc2626;--warn:#f59e0b;--ok:#16a34a;}
  *{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{margin:0;background:#f3f0ff;color:#1e1b2e;padding:16px;padding-bottom:60px;}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .top a{color:var(--accent);text-decoration:none;font-weight:700;font-size:14px;}
  h1{font-size:20px;margin:0;}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(124,58,237,.08);}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  input[type=date]{padding:8px;border-radius:8px;border:1.5px solid #ddd6fe;font-size:13px;}
  select{padding:8px;border-radius:8px;border:1.5px solid #ddd6fe;font-size:13px;}
  button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{background:#f5f3ff;text-align:left;padding:7px 8px;position:sticky;top:0;}
  td{padding:7px 8px;border-bottom:1px solid #f1f0fb;}
  .rate-bad{color:var(--bad);font-weight:800;}
  .rate-warn{color:var(--warn);font-weight:800;}
  .rate-ok{color:var(--ok);font-weight:700;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:800;}
  .badge.high{background:#fee2e2;color:var(--bad);}
  .badge.mid{background:#fef3c7;color:#b45309;}
  .empty{text-align:center;color:#999;padding:30px;font-size:13px;}
  .note{font-size:11.5px;color:#7c7c8a;margin-top:6px;}
  .scroll{overflow-x:auto;}
</style>
</head>
<body>
<div class="top"><a href="index.html">← Seller Pro</a></div>
<h1>🚨 RTO / Return Pattern Alerts</h1>
<div class="note">Kaunsa SKU ya courier average se zyada return/cancel de raha hai — pattern turant pakड़o.</div>

<div class="card">
  <div class="row">
    <input type="date" id="dFrom">
    <span>se</span>
    <input type="date" id="dTo">
    <button onclick="loadData()">🔍 Analyze Karo</button>
  </div>
  <div class="row">
    <select id="viewBy" onchange="render()">
      <option value="sku">SKU-wise</option>
      <option value="courier">Courier-wise</option>
    </select>
  </div>
</div>

<div class="card" id="resultCard" style="display:none">
  <div class="scroll">
    <table id="tb"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table>
  </div>
  <div class="note" id="summary"></div>
</div>

<div class="card empty" id="emptyState">Date range choose karke "Analyze Karo" dabao.</div>

<script src="shared-config.js"></script>
<script>
let _orders=[], _cancels=[], _returns=[];

function getTodayStr(){
  const d=new Date(Date.now()+5.5*3600*1000);
  return d.toISOString().slice(0,10);
}
(function initDates(){
  const to=getTodayStr();
  const fromD=new Date(Date.now()+5.5*3600*1000 - 30*86400000);
  document.getElementById('dTo').value=to;
  document.getElementById('dFrom').value=fromD.toISOString().slice(0,10);
})();

async function loadData(){
  const from=document.getElementById('dFrom').value;
  const to=document.getElementById('dTo').value;
  if(!from||!to){alert('Dono dates choose karo');return;}
  document.getElementById('emptyState').textContent='⏳ Data la rahe hain...';
  document.getElementById('emptyState').style.display='block';
  document.getElementById('resultCard').style.display='none';
  const filt='date=gte.'+from+'&date=lte.'+to;
  [_orders,_cancels,_returns]=await Promise.all([
    sbGetAll('orders','awb,sku,courier,platform,product_name', filt),
    sbGetAll('cancels','awb,sku,courier,platform,product_name', filt),
    sbGetAll('returns','awb,sku,courier,platform,product_name', filt)
  ]);
  if(!_orders.length){
    document.getElementById('emptyState').textContent='❌ Is date range mein koi orders nahi mile.';
    document.getElementById('emptyState').style.display='block';
    return;
  }
  document.getElementById('emptyState').style.display='none';
  document.getElementById('resultCard').style.display='block';
  render();
}

function render(){
  const by=document.getElementById('viewBy').value; // 'sku' or 'courier'
  const key = by==='sku' ? (r=>r.sku||r.product_name||'—') : (r=>r.courier||'—');
  const stats={};
  const bump=(map,k,field)=>{ if(!map[k]) map[k]={orders:0,cancels:0,returns:0}; map[k][field]++; };
  _orders.forEach(r=>bump(stats,key(r),'orders'));
  _cancels.forEach(r=>bump(stats,key(r),'cancels'));
  _returns.forEach(r=>bump(stats,key(r),'returns'));

  const rows=Object.keys(stats).map(k=>{
    const s=stats[k];
    const bad=s.cancels+s.returns;
    const rate = s.orders>0 ? (bad/s.orders*100) : 0;
    return {key:k, orders:s.orders, cancels:s.cancels, returns:s.returns, rate};
  }).filter(r=>r.orders>=3); // bahut kam orders wale noise hote hain, skip

  if(!rows.length){
    document.getElementById('tbody').innerHTML='<tr><td colspan="5" style="text-align:center;color:#999;padding:20px">Kaafi data nahi (min 3 orders per '+by+' chahiye)</td></tr>';
    document.getElementById('summary').textContent='';
    return;
  }

  const avgRate = rows.reduce((a,r)=>a+r.rate,0)/rows.length;
  rows.sort((a,b)=>b.rate-a.rate);

  const thead=document.getElementById('thead');
  thead.innerHTML='<th>'+(by==='sku'?'SKU / Product':'Courier')+'</th><th>Orders</th><th>Cancels</th><th>Returns</th><th>Return+Cancel %</th>';

  const tbody=document.getElementById('tbody');
  tbody.innerHTML=rows.map(r=>{
    let cls='rate-ok', badge='';
    if(r.rate >= avgRate*2 && r.rate>=15){ cls='rate-bad'; badge='<span class="badge high">🔴 HIGH</span>'; }
    else if(r.rate >= avgRate*1.4 && r.rate>=8){ cls='rate-warn'; badge='<span class="badge mid">🟡 WATCH</span>'; }
    return '<tr><td>'+esc(r.key)+' '+badge+'</td><td>'+r.orders+'</td><td>'+r.cancels+'</td><td>'+r.returns+'</td><td class="'+cls+'">'+r.rate.toFixed(1)+'%</td></tr>';
  }).join('');

  document.getElementById('summary').textContent = 'Average return+cancel rate: ' + avgRate.toFixed(1) + '% — 🔴 HIGH = average se 2x+ zyada, 🟡 WATCH = 1.4x+ zyada';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
</body>
</html>
